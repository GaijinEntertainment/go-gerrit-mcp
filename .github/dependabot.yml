version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-deps:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /plugins
    schedule:
      interval: weekly
    groups:
      plugin-tooling:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types:
          - minor
          - patch
