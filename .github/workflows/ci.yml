name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # The line of the go.mod floor. It is also the newest stable line,
          # which releases build with.
          go-version: "1.27"
      - run: go build ./...
      - run: go test -race ./...

  plugins:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1
        with:
          working-directory: plugins
          cache: true
      # The plugin check runs claude plugin validate and claude plugin test.
      - run: npm install -g @anthropic-ai/claude-code@latest
      - run: vp check
      - run: vp exec rumdl fmt --check .
      - run: vp run typecheck
      - run: vp run plugins

  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
      - name: image smoke test
        # Without the required env the image must serve MCP, and its
        # get_server_info must name the missing variables.
        run: |
          img=$(docker image ls --format '{{.Repository}}:{{.Tag}}' ghcr.io/gaijinentertainment/go-gerrit-mcp \
            | grep -- '-amd64$' | head -n 1)
          [[ -n "$img" ]] || { echo "no snapshot image found" >&2; exit 1; }

          coproc mcp { docker run --rm -i "$img"; }
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"get_server_info","arguments":{}}}' \
            >&"${mcp[1]}"

          info=
          while [[ -z "$info" ]] && IFS= read -r -t 60 line <&"${mcp[0]}"; do
            info=$(jq -r 'select(.id == 2) | .result.content[0].text' <<<"$line")
          done

          printf '%s\n' "$info"
          jq -e '.state == "not_configured" and (.reason | contains("GERRIT_URL"))' <<<"$info" >/dev/null \
            || { echo "get_server_info must report not_configured and name the missing env var" >&2; exit 1; }

  # ci-ok is the single branch-protection gate: it passes only when every job
  # of the run passed or was skipped — so conditional jobs never need
  # enumerating in rulesets. Any other result fails it, including "abandoned",
  # which GitHub gives a job that got no runner.
  ci-ok:
    if: always()
    needs: [lint, test, plugins, release-dry-run]
    runs-on: ubuntu-latest
    steps:
      - name: verify all jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          jq --exit-status 'all(. == "success" or . == "skipped")' <<< "$RESULTS"
